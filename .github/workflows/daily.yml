name: Daily content

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python pipeline/build_day.py && exit 0
            echo "Attempt $attempt failed, retrying in 60s"; sleep 60
          done
          exit 1

      - name: Commit
        run: |
          git config user.name "detour-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content pipeline/history.json
          git diff --cached --quiet && exit 0
          git commit -m "content: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push
